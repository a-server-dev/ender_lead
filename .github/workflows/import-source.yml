name: Import EnderLead v1.0.3 sources
on:
  push:
    paths:
      - 'source/EnderLead-1.0.3.tar.xz'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract source files into repository
        shell: bash
        run: |
          set -euo pipefail
          test -f source/EnderLead-1.0.3.tar.xz || exit 0
          echo "11eeb433ef5ac5cbac4a6c0cdaaf17c9703dde716451b91cc96adeb9584b483d  source/EnderLead-1.0.3.tar.xz" | sha256sum -c -
          mkdir -p .source-import
          tar -xJf source/EnderLead-1.0.3.tar.xz -C .source-import
          cp -a .source-import/EnderLead-1.0.3/. .
          rm -rf .source-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r source
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import complete EnderLead v1.0.3 source and Gradle project"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile Paper plugin
        run: gradle clean build --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EnderLead-jar
          path: build/libs/EnderLead-*.jar
